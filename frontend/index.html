<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LibraryHub - Discover your next favorite book</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">LibraryHub</div>
        <div class="nav-links" id="navLinks">
            <!-- Dynamic nav links -->
        </div>
    </nav>

    <section class="hero">
        <h1>Welcome to LibraryHub</h1>
        <p>Discover your next favorite book</p>
        <div class="search-box" style="display: flex; align-items: center; justify-content: center; gap: 0.75rem; max-width: 900px; margin: 0 auto;">
            <input type="text" id="searchInput" placeholder="Search for books, authors, or genres..." style="flex: 1; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; min-width: 250px;">
            <button type="button" id="searchBtn" onclick="performSearch()" style="padding: 0.9rem 1.5rem; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; white-space: nowrap;">🔍 Search</button>
            <select id="searchCategory" style="padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; background: white; cursor: pointer; white-space: nowrap; min-width: 120px;">
                <option value="all">All</option>
                <option value="title">Book Name</option>
                <option value="author">Author</option>
                <option value="category">Genre</option>
            </select>
        </div>
    </section>

    <div class="container">
        <h2 class="section-title">Featured Books</h2>
        <div class="books-grid" id="booksGrid"></div>
        
        
    </div>

    <!-- Book Detail Modal -->
    <div id="bookModal" class="modal hidden">
        <div class="modal-content">
            <span class="modal-close" onclick="closeBookModal()">&times;</span>
            <div class="modal-body">
                <div class="modal-image" id="modalImage"></div>
                <div class="modal-info">
                    <h3 id="modalTitle"></h3>
                    <p id="modalAuthor"></p>
                    <p id="modalCategory"></p>
                    <p id="modalDescription"></p>
                    <p id="modalAvailability"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Borrow Request Modal -->
    <div id="borrowModal" class="modal hidden">
        <div class="modal-content borrow-modal">
            <span class="modal-close" onclick="closeBorrowModal()">&times;</span>
            <h3>Request to Borrow</h3>
            <p id="borrowBookTitle" class="borrow-modal-book"></p>
            <p class="borrow-modal-subtitle">Choose your borrow and return dates (max 15 days).</p>
            <form id="borrowForm" class="borrow-modal-body">
                <label for="borrowDate">Borrow date</label>
                <input type="date" id="borrowDate" required>

                <label for="returnDate">Return date</label>
                <input type="date" id="returnDate" required>

                <div class="modal-actions">
                    <button type="button" class="book-btn btn-secondary" onclick="closeBorrowModal()">Cancel</button>
                    <button type="submit" class="book-btn btn-borrow">Submit request</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Update nav based on login
        function updateNav() {
            const navLinks = document.getElementById('navLinks');
            const token = localStorage.getItem('token');
            const isAdmin = localStorage.getItem('isAdmin') === 'true';
            const username = localStorage.getItem('username');
            
            if (token) {
                navLinks.innerHTML = `
                    <a href="/static/profile.html">👤 ${username}</a>
                    ${isAdmin ? '<a href="/static/admin.html">Admin</a>' : ''}
                    <a href="#" onclick="logout()" class="login-btn">Logout</a>
                `;
            } else {
                navLinks.innerHTML = `
                    <a href="/static/signup.html">Signup</a>
                    <a href="/static/login.html" class="login-btn">👤 Login</a>
                `;
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('isAdmin');
            localStorage.removeItem('username');
            updateNav();
            loadBooks();
        }


        // Borrow book - request with styled modal
        const borrowState = { bookId: null };

        function formatDateInput(date) {
            return date.toISOString().split('T')[0];
        }

        function addDays(date, days) {
            const copy = new Date(date);
            copy.setDate(copy.getDate() + days);
            return copy;
        }

        // Handle borrow click from landing cards
        function handleBorrowClick(bookId) {
            const token = localStorage.getItem('token');
            if (!token) {
                alert('Please login to request books');
                window.location.href = '/static/login.html';
                return;
            }
            window.location.href = `/static/borrow-request.html?id=${bookId}`;
        }

        function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            const category = document.getElementById('searchCategory').value;
            
            if (query === '') {
                loadBooks('');
                return;
            }
            
            searchBooks(query, category);
        }

        function setReturnDateLimits(borrowDateStr) {
            const returnDateInput = document.getElementById('returnDate');
            if (!borrowDateStr) return;

            const borrowDate = new Date(borrowDateStr);
            const maxDate = addDays(borrowDate, 15);
            const minStr = formatDateInput(borrowDate);
            const maxStr = formatDateInput(maxDate);

            returnDateInput.min = minStr;
            returnDateInput.max = maxStr;

            if (returnDateInput.value && returnDateInput.value < minStr) {
                returnDateInput.value = minStr;
            }
            if (returnDateInput.value && returnDateInput.value > maxStr) {
                returnDateInput.value = maxStr;
            }
        }

        function closeBorrowModal() {
            document.getElementById('borrowModal').classList.add('hidden');
            document.getElementById('borrowForm').reset();
            borrowState.bookId = null;
        }

        function openBorrowModal(bookId, title) {
            const token = localStorage.getItem('token');
            if (!token) {
                alert('Please login to request books');
                window.location.href = '/static/login.html';
                return;
            }

            borrowState.bookId = bookId;
            const today = new Date();
            const todayStr = formatDateInput(today);
            const borrowDateInput = document.getElementById('borrowDate');
            const returnDateInput = document.getElementById('returnDate');

            borrowDateInput.min = todayStr;
            borrowDateInput.value = todayStr;
            setReturnDateLimits(todayStr);

            const defaultReturn = addDays(today, 7);
            returnDateInput.value = formatDateInput(defaultReturn);

            document.getElementById('borrowBookTitle').textContent = title;
            document.getElementById('borrowModal').classList.remove('hidden');
        }

        async function submitBorrowRequest() {
            const token = localStorage.getItem('token');
            if (!token) {
                alert('Please login to request books');
                window.location.href = '/static/login.html';
                return;
            }

            if (!borrowState.bookId) {
                alert('No book selected. Please try again.');
                closeBorrowModal();
                return;
            }

            const borrowDate = document.getElementById('borrowDate').value;
            const returnDate = document.getElementById('returnDate').value;

            if (!borrowDate || !returnDate) {
                alert('Please select both borrow and return dates');
                return;
            }

            const borrow = new Date(borrowDate);
            const returnD = new Date(returnDate);
            const daysDiff = Math.ceil((returnD - borrow) / (1000 * 60 * 60 * 24));

            if (returnD <= borrow) {
                alert('Return date must be after borrow date');
                return;
            }
            if (daysDiff > 15) {
                alert('Borrow period cannot exceed 15 days');
                return;
            }

            try {
                const response = await fetch('/borrow/request', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                    },
                    body: JSON.stringify({
                        book_id: borrowState.bookId,
                        requested_borrow_date: borrowDate + 'T00:00:00',
                        requested_return_date: returnDate + 'T00:00:00'
                    }),
                });
                if (response.ok) {
                    alert('Borrow request submitted! Admin will review it.');
                    closeBorrowModal();
                    loadBooks();
                } else {
                    const error = await response.json();
                    alert('Error: ' + (error.detail || error.message || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error requesting book:', error);
                alert('Failed to request book: ' + error.message);
            }
        }

        document.getElementById('borrowDate').addEventListener('change', (event) => {
            setReturnDateLimits(event.target.value);
        });

        document.getElementById('borrowForm').addEventListener('submit', (event) => {
            event.preventDefault();
            submitBorrowRequest();
        });




        // Load books from API
        async function loadBooks(query = '') {
            try {
                const url = query ? `/books/search?query=${encodeURIComponent(query)}` : '/books';
                const response = await fetch(url);
                const books = await response.json();
                renderBooks(books);
            } catch (error) {
                console.error('Error loading books:', error);
            }
        }

        // Search books by category
        async function searchBooks(query, category) {
            try {
                let url = '/books';
                if (query) {
                    if (category === 'all') {
                        url = `/books/search?query=${encodeURIComponent(query)}`;
                    } else {
                        url = `/books/search?query=${encodeURIComponent(query)}&category=${encodeURIComponent(category)}`;
                    }
                }
                const response = await fetch(url);
                const books = await response.json();
                renderBooks(books);
            } catch (error) {
                console.error('Error searching books:', error);
            }
        }

        // Render books in grid
        function renderBooks(books) {
            const booksGrid = document.getElementById('booksGrid');
            booksGrid.innerHTML = '';
            books.forEach(book => {
                const rating = 4;
                const stars = '⭐'.repeat(rating);
                const status = book.available_copies > 0 ? 'Available' : 'Borrowed';
                const statusClass = status === 'Borrowed' ? 'status-borrowed' : 'status-available';
                const borrowButton = status === 'Borrowed'
                    ? '<button class="book-btn btn-unavailable" disabled>📋 Unavailable</button>'
                    : `<button class="book-btn btn-borrow" onclick="handleBorrowClick(${book.id})">📚 Borrow</button>`;

                const bookCard = document.createElement('div');
                bookCard.className = 'book-card';
                const imageHtml = book.picture_url ? `<img src="${book.picture_url}" alt="${book.title}" class="book-image">` : '<div class="book-image"></div>';
                bookCard.innerHTML = `
                    ${imageHtml}
                    <div class="book-info">
                        <h3 class="book-title">${book.title}</h3>
                        <p class="book-author">${book.author}</p>
                        <div class="rating">
                            <span class="stars">${stars}</span>
                            <span class="rating-count">(${Math.floor(Math.random() * 500) + 100})</span>
                        </div>
                        <p class="book-description">${book.description}</p>
                        <span class="book-status ${statusClass}">${status}</span>
                        <div class="book-actions">
                            ${borrowButton}
                            <a href="/static/book-details.html?id=${book.id}" class="book-btn btn-secondary" style="text-decoration: none; display: inline-block; text-align: center; line-height: 1.5;">View Details</a>
                        </div>
                    </div>
                `;
                booksGrid.appendChild(bookCard);
            });
        }

        // Book modal handler
        async function openBookModal(bookId) {
            try {
                const response = await fetch(`/books/${bookId}`);
                if (!response.ok) throw new Error('Failed to load book');
                const book = await response.json();

                const imageHtml = book.picture_url
                    ? `<img src="${book.picture_url}" alt="${book.title}" class="modal-image-el">`
                    : '<div class="modal-image-placeholder"></div>';
                document.getElementById('modalImage').innerHTML = imageHtml;
                document.getElementById('modalTitle').textContent = book.title;
                document.getElementById('modalAuthor').textContent = `by ${book.author}`;
                document.getElementById('modalCategory').textContent = book.category ? `Category: ${book.category}` : '';
                document.getElementById('modalDescription').textContent = book.description || 'No description provided.';
                document.getElementById('modalAvailability').textContent = `Available: ${book.available_copies}/${book.total_copies}`;

                const statusAvailable = book.available_copies > 0;
                const borrowBtn = document.getElementById('modalBorrowBtn');
                if (borrowBtn) {
                    borrowBtn.textContent = statusAvailable ? 'Borrow' : 'Unavailable';
                    borrowBtn.disabled = !statusAvailable;
                    borrowBtn.onclick = () => openBorrowModal(book.id, book.title);
                }

                document.getElementById('bookModal').classList.remove('hidden');
            } catch (err) {
                console.error('Error opening book modal:', err);
            }
        }

        function closeBookModal() {
            document.getElementById('bookModal').classList.add('hidden');
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') performSearch();
        });
        
        document.getElementById('searchInput').addEventListener('input', function(e) {
            // Clear search when input is empty
            if (e.target.value.trim() === '') {
                loadBooks('');
            }
        });

        updateNav();
        loadBooks();
    </script>
</body>
</html>
